# K-01 · nothing goes in or out of a namespace unless a later policy says so (F1-11b, ARG-003).
# The only way out a pod has by default is the DNS of the cluster; every other flow is opened by the
# policy of the component that needs it, next to its manifests (K-03 onwards).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: argos-core
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
