# K-10 · Prometheus of the bench: the same rules as development (deploy/dev/prometheus/prometheus.yml)
# with the names of the cluster.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# F09-08 and F09-12 (security log and backup) and F10-03 (the objectives of the specification).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.argos-core.svc:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The API publishes the security log as metrics: events by kind and outcome, and the chain.
  - job_name: argos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api.argos-services.svc:8000"]
  # F10-02 (ARG-094): the domain health (journal, WORM canary, queues, gates, circuits, jobs).
  - job_name: argos-health
    metrics_path: /metrics
    static_configs:
      - targets: ["health.argos-services.svc:8000"]
