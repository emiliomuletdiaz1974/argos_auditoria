# K-07 · the SMB share of the simulated client (F02-08): the synthetic file tree of development,
# generated again, the same, by the init container. `argos_ro` reads it with the password the seeder
# generated (secret bench-sources).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-smb
  namespace: bench-sources
  labels:
    app.kubernetes.io/name: source-smb
    app.kubernetes.io/part-of: argos-bench
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: source-smb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: source-smb
        app.kubernetes.io/part-of: argos-bench
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          image: argos-bench-seed
          command: ["/app/.venv/bin/python", "/app/tools/prepare_dev_sources.py", "--files", "/shares/clinical"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: share
              mountPath: /shares/clinical
      containers:
        - name: source-smb
          image: servercontainers/samba@sha256:de2f1c141e497ea287ba099788cb4526859f0b0336214a7e7dcf89d1f90525b7
          env:
            - name: ACCOUNT_argos_ro
              valueFrom:
                secretKeyRef:
                  name: bench-sources
                  key: smb
            - name: UID_argos_ro
              value: "1000"
            - name: SAMBA_VOLUME_CONFIG_clinical
              value: "[clinical]; path=/shares/clinical; valid users = argos_ro; guest ok = no; read only = yes; browseable = yes"
          ports:
            - containerPort: 445
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: share
              mountPath: /shares/clinical
              readOnly: true
      volumes:
        - name: share
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: source-smb
  namespace: bench-sources
spec:
  selector:
    app.kubernetes.io/name: source-smb
  ports:
    - name: smb
      port: 445
      targetPort: 445
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-smb
  namespace: bench-sources
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: source-smb
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [challenge-worker, inventory-scheduler]
      ports:
        - protocol: TCP
          port: 445
