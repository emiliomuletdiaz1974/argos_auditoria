# K-07 · the directory of the simulated client (F02-08): OpenLDAP over LDAPS with the synthetic
# users and groups of development. Its certificate comes from the CA of the bench, so the readers
# of ARGOS check it with the ca.crt of their own certificate. The passwords come from the seeder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-ldap
  namespace: bench-sources
  labels:
    app.kubernetes.io/name: source-ldap
    app.kubernetes.io/part-of: argos-bench
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: source-ldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: source-ldap
        app.kubernetes.io/part-of: argos-bench
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          image: argos-bench-seed
          command: ["/app/.venv/bin/python", "/app/tools/prepare_dev_sources.py", "--ldif", "/ldif"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ldif
              mountPath: /ldif
      containers:
        - name: source-ldap
          image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
          args: ["--copy-service"]
          env:
            - name: LDAP_ORGANISATION
              value: Synthetic Hospital
            - name: LDAP_DOMAIN
              value: hosp.local
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-sources
                  key: ldap-admin
            - name: LDAP_READONLY_USER
              value: "true"
            - name: LDAP_READONLY_USER_USERNAME
              value: argos_ro
            - name: LDAP_READONLY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-sources
                  key: ldap-ro
            - name: LDAP_TLS
              value: "true"
            - name: LDAP_TLS_CRT_FILENAME
              value: server.crt
            - name: LDAP_TLS_KEY_FILENAME
              value: server.key
            - name: LDAP_TLS_CA_CRT_FILENAME
              value: ca.crt
            - name: LDAP_TLS_VERIFY_CLIENT
              value: never
            - name: LDAP_LOG_LEVEL
              value: "256"
          ports:
            - containerPort: 636
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: certs
              mountPath: /container/service/slapd/assets/certs
              readOnly: true
            - name: ldif
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: source-ldap-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
              - key: ca.crt
                path: ca.crt
        - name: ldif
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: source-ldap
  namespace: bench-sources
spec:
  selector:
    app.kubernetes.io/name: source-ldap
  ports:
    - name: ldaps
      port: 636
      targetPort: 636
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-ldap
  namespace: bench-sources
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: source-ldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [challenge-worker, inventory-scheduler]
      ports:
        - protocol: TCP
          port: 636
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: source-ldap
  namespace: bench-sources
spec:
  secretName: source-ldap-tls
  commonName: source-ldap.bench-sources.svc
  dnsNames:
    - source-ldap.bench-sources.svc
    - source-ldap.bench-sources.svc.cluster.local
  duration: 720h
  renewBefore: 240h
  usages: ["server auth", "digital signature", "key encipherment"]
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: vault-bench
    kind: ClusterIssuer
