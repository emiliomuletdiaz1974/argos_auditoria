# K-06 · the campaign worker (ARG-043): it runs the workflows of Temporal, asks OPA for the
# operational rules and reads the credential of each connector from Vault. It never reaches the AI
# gateway (F06-01). Its probes read the simulated sources of bench-sources (K-07).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-worker
  namespace: argos-services
  labels:
    app.kubernetes.io/name: challenge-worker
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  # K-99: a durable consumer of the bus takes one subscriber; the old pod stops first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: challenge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challenge-worker
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: challenge
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: challenge-worker
          image: argos-challenge-engine
          command: ["/app/.venv/bin/python", "-m", "argos_challenges.worker"]
          env:
            - name: ARGOS_ENVIRONMENT
              value: staging
            - name: ARGOS_LOG_LEVEL
              value: INFO
            - name: ARGOS_LOKI_URL
              value: http://loki.argos-core.svc:3100/loki/api/v1/push
            - name: ARGOS_DATABASE_URL
              value: postgresql://postgres.argos-core.svc:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
            - name: ARGOS_DATABASE_VAULT_ROLE
              value: svc-challenge
            - name: PGSERVICEFILE
              value: /tmp/argos-db/pg_service.conf
            - name: ARGOS_VAULT_ADDR
              value: http://vault.argos-core.svc:8200
            - name: ARGOS_VAULT_KUBERNETES_ROLE
              value: challenge
            - name: ARGOS_TLS_DIR
              value: /run/tls
            - name: ARGOS_TEMPORAL_ADDRESS
              value: temporal.argos-core.svc:7233
            - name: ARGOS_NATS_URL
              value: tls://nats.argos-core.svc:4222
            - name: ARGOS_NATS_USER
              value: challenge
            - name: ARGOS_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: challenge
            - name: ARGOS_OPA_URL
              value: http://opa.argos-core.svc:8181
            - name: ARGOS_OPA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opa-clients
                  key: challenge
            - name: ARGOS_OIDC_ISSUER
              value: http://keycloak.argos-core.svc:8080/realms/argos
            - name: ARGOS_OIDC_AUDIENCE
              value: argos-api
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: challenge-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: challenge-worker
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: challenge-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opa
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bench-sources
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 445
        - protocol: TCP
          port: 7070
        - protocol: TCP
          port: 636
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4242
