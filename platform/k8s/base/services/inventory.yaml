# K-07 · the inventory (ARG-022, ARG-030): the scheduler plans a rescan every hour and runs the
# connectors against the simulated sources of bench-sources, with the credential of each one in Vault;
# what it discovers goes to NATS, and the ingest writes it to the graph. In development these ran
# from the host; the bench is where they first run as services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-scheduler
  namespace: argos-services
  labels:
    app.kubernetes.io/name: inventory-scheduler
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-scheduler
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: inventory
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-scheduler
          image: argos-api
          command: ["/app/.venv/bin/python", "-m", "argos_inventory.scheduler.worker"]
          env:
            - name: ARGOS_ENVIRONMENT
              value: staging
            - name: ARGOS_LOG_LEVEL
              value: INFO
            - name: ARGOS_LOKI_URL
              value: http://loki.argos-core.svc:3100/loki/api/v1/push
            - name: ARGOS_DATABASE_URL
              value: postgresql://postgres.argos-core.svc:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
            - name: ARGOS_DATABASE_VAULT_ROLE
              value: svc-inventory
            - name: PGSERVICEFILE
              value: /tmp/argos-db/pg_service.conf
            - name: ARGOS_VAULT_ADDR
              value: http://vault.argos-core.svc:8200
            - name: ARGOS_VAULT_KUBERNETES_ROLE
              value: inventory
            - name: ARGOS_TLS_DIR
              value: /run/tls
            - name: ARGOS_TEMPORAL_ADDRESS
              value: temporal.argos-core.svc:7233
            - name: ARGOS_NATS_URL
              value: tls://nats.argos-core.svc:4222
            - name: ARGOS_NATS_USER
              value: inventory
            - name: ARGOS_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: inventory
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: inventory-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-scheduler
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory-scheduler
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bench-sources
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 445
        - protocol: TCP
          port: 7070
        - protocol: TCP
          port: 636
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4242
---
