# K-08 · the API on its public name, only on 443 (websecure); the certificate, from Let's Encrypt.
# Only Traefik reaches the API from outside its namespace, and the ACME solver that cert-manager
# starts here while it issues the certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: argos-services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.34-134-21-66.sslip.io]
      secretName: api-public-tls
  rules:
    - host: api.34-134-21-66.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-traefik
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
---
# The IRIs of the obligations (https://ns.argos.eu/norms/…) open: the public verifier answers
# `/norms/` with a page, Turtle or JSON-LD. And the QR of a printed dossier opens too: `/verify`
# answers its GET with the dossier it names and how to check it, and takes the POST of a bundle.
# This name stands for ns.argos.eu until that domain is ours; then that name is added here with its
# certificate, and nothing else changes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: norms
  namespace: argos-services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ns.34-134-21-66.sslip.io]
      secretName: norms-public-tls
  rules:
    - host: ns.34-134-21-66.sslip.io
      http:
        paths:
          - path: /norms/
            pathType: Prefix
            backend:
              service:
                name: verifier
                port:
                  number: 8007
          - path: /verify
            pathType: Prefix
            backend:
              service:
                name: verifier
                port:
                  number: 8007
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verifier-from-traefik
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: verifier
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8007
