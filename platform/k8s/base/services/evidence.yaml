    matchLabels:
      app.kubernetes.io/name: evidence-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidence-api
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: evidence
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evidence-api
          image: argos-evidence
          command: ["/app/.venv/bin/python", "-m", "argos_evidence.api"]
          env:
            - name: ARGOS_ENVIRONMENT
              value: staging
            - name: ARGOS_LOG_LEVEL
              value: INFO
            - name: ARGOS_DATABASE_URL
              value: postgresql://postgres.argos-core.svc:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
            - name: ARGOS_DATABASE_VAULT_ROLE
              value: svc-evidence
            - name: PGSERVICEFILE
              value: /tmp/argos-db/pg_service.conf
            - name: ARGOS_VAULT_ADDR
              value: http://vault.argos-core.svc:8200
            - name: ARGOS_VAULT_KUBERNETES_ROLE
              value: evidence
            - name: ARGOS_TLS_DIR
              value: /run/tls
            - name: ARGOS_API_BIND
              value: 0.0.0.0
            - name: ARGOS_EVIDENCE_ISSUER_DID
              value: did:web:evidence-api.argos-services.svc%3A8008
            - name: ARGOS_EVIDENCE_STATUS_BASE_URL
              value: http://evidence-api.argos-services.svc:8008/status
            - name: ARGOS_EVIDENCE_CREDENTIAL_BASE_URL
              value: http://evidence-api.argos-services.svc:8008/credentials
            - name: ARGOS_EVIDENCE_VERIFIER_URL
              value: http://verifier.argos-services.svc:8007/verify
            - name: ARGOS_EVIDENCE_RETENTION_DAYS
              value: "30"
            - name: ARGOS_EVIDENCE_S3_ENDPOINT
              value: http://evidence-store.argos-core.svc:7070
            - name: ARGOS_EVIDENCE_S3_ACCESS_KEY
              valueFrom:
