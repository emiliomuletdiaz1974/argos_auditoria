                  key: secret
            - name: ARGOS_EVIDENCE_TSA_URL
              value: http://tsa.argos-core.svc:3180
            - name: ARGOS_EVIDENCE_TSA_ROOTS_URL
              value: http://tsa.argos-core.svc:3180/ca.pem
          ports:
            - name: http
              containerPort: 8008
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: evidence-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
