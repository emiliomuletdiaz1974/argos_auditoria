# K-06 · evidence (F07-13): the worker listens for sealed campaigns on NATS and carries each one
# to its credential, signed with the key argos-evidence of Vault, which never leaves it; the API
# publishes only what a verification needs (DID, status lists, credentials). Both reach the WORM
# store and the test TSA of argos-core. The retention of the bench is 30 days.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-worker
  namespace: argos-services
  labels:
    app.kubernetes.io/name: evidence-worker
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evidence-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidence-worker
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: evidence
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evidence-worker
          image: argos-evidence
          command: ["/app/.venv/bin/python", "-m", "argos_evidence.worker"]
          env:
            - name: ARGOS_ENVIRONMENT
              value: staging
            - name: ARGOS_LOG_LEVEL
              value: INFO
            - name: ARGOS_DATABASE_URL
              value: postgresql://postgres.argos-core.svc:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
            - name: ARGOS_DATABASE_VAULT_ROLE
              value: svc-evidence
            - name: PGSERVICEFILE
              value: /tmp/argos-db/pg_service.conf
            - name: ARGOS_VAULT_ADDR
              value: http://vault.argos-core.svc:8200
            - name: ARGOS_VAULT_KUBERNETES_ROLE
              value: evidence
            - name: ARGOS_TLS_DIR
              value: /run/tls
            - name: ARGOS_TEMPORAL_ADDRESS
              value: temporal.argos-core.svc:7233
            - name: ARGOS_NATS_URL
              value: tls://nats.argos-core.svc:4222
            - name: ARGOS_NATS_USER
              value: evidence
            - name: ARGOS_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: evidence
            - name: ARGOS_EVIDENCE_ISSUER_DID
              value: did:web:evidence-api.argos-services.svc%3A8008
            - name: ARGOS_EVIDENCE_STATUS_BASE_URL
              value: http://evidence-api.argos-services.svc:8008/status
            - name: ARGOS_EVIDENCE_CREDENTIAL_BASE_URL
              value: http://evidence-api.argos-services.svc:8008/credentials
            - name: ARGOS_EVIDENCE_VERIFIER_URL
              value: http://verifier.argos-services.svc:8007/verify
            - name: ARGOS_EVIDENCE_RETENTION_DAYS
              value: "30"
            - name: ARGOS_EVIDENCE_S3_ENDPOINT
              value: http://evidence-store.argos-core.svc:7070
            - name: ARGOS_EVIDENCE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: evidence-store
                  key: access
            - name: ARGOS_EVIDENCE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: evidence-store
                  key: secret
            - name: ARGOS_EVIDENCE_TSA_URL
              value: http://tsa.argos-core.svc:3180
            - name: ARGOS_EVIDENCE_TSA_ROOTS_URL
              value: http://tsa.argos-core.svc:3180/ca.pem
            - name: ARGOS_EVIDENCE_STAMP_ATTEMPTS
              value: "12"
            - name: ARGOS_EVIDENCE_STAMP_WAIT_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: evidence-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidence-worker
  namespace: argos-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidence-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: evidence-store
      ports:
        - protocol: TCP
          port: 7070
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-core
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tsa
      ports:
        - protocol: TCP
          port: 3180
---
apiVersion: apps/v1
