# K-03 · the time stamping authority of tests (ARG-065, deviation note ARG-064-065): RFC 3161 from
# `openssl ts` with its own test CA, created on first start in its volume and never in the
# repository. Its stamps are not qualified; the real TSA is a contract that waits (F07-16).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tsa
  namespace: argos-core
  labels:
    app.kubernetes.io/name: tsa
    app.kubernetes.io/part-of: argos
spec:
  serviceName: tsa
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tsa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsa
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tsa
          image: argos-tsa
          ports:
            - name: http
              containerPort: 3180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tsa
  namespace: argos-core
  labels:
    app.kubernetes.io/name: tsa
    app.kubernetes.io/part-of: argos
spec:
  selector:
    app.kubernetes.io/name: tsa
  ports:
    - name: http
      port: 3180
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsa
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tsa
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
      ports:
        - protocol: TCP
          port: 3180
