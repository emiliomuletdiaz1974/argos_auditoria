# K-03 · the WORM store of the evidence (ARG-061): versitygw over its own volume, the gateway the
# conformance test of F07-04 chose. Object lock needs versions, so it keeps them. The evidence
# service creates its locked bucket itself. The S3 keys are the secret the seeder generated; in
# development they were written in the compose.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evidence-store
  namespace: argos-core
  labels:
    app.kubernetes.io/name: evidence-store
    app.kubernetes.io/part-of: argos
spec:
  serviceName: evidence-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evidence-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidence-store
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versitygw
          image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          command: ["sh", "-c"]
          args:
            - >-
              mkdir -p /data/objects /data/versions &&
              exec versitygw --access "$S3_ACCESS_KEY" --secret "$S3_SECRET_KEY"
              posix --versioning-dir /data/versions /data/objects
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: evidence-store
                  key: access
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: evidence-store
                  key: secret
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        # K-99: how full the volume is (used and total), for the health service, which cannot mount
        # it from argos-services (usage.py).
        - name: usage
          image: python:3.12.15-slim@sha256:29113dcae7aad06daa8e95260fa09f27d62be33b9687ea3774f771d601a02256
          command: ["python", "/usage/usage.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: usage
              containerPort: 9101
          readinessProbe:
            tcpSocket:
              port: usage
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: usage
              mountPath: /usage
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: usage
          configMap:
            name: evidence-usage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-store
  namespace: argos-core
  labels:
    app.kubernetes.io/name: evidence-store
    app.kubernetes.io/part-of: argos
spec:
  selector:
    app.kubernetes.io/name: evidence-store
  ports:
    - name: s3
      port: 7070
      targetPort: s3
    - name: usage
      port: 9101
      targetPort: usage
---
# Only argos-services, where the evidence service runs, reaches the store; and only the health
# service reaches the usage of its volume (K-99).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidence-store
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidence-store
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
      ports:
        - protocol: TCP
          port: 7070
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
          podSelector:
            matchLabels:
              app.kubernetes.io/name: health
      ports:
        - protocol: TCP
          port: 9101
