# K-03 · the database of Temporal, apart from the one of ARGOS as in the development environment.
# There it trusted every connection; here it asks for the password the seeder generated (SCRAM), and
# only the Temporal server reaches it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-db
  namespace: argos-core
  labels:
    app.kubernetes.io/name: temporal-db
    app.kubernetes.io/part-of: argos
spec:
  serviceName: temporal-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-db
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          args: ["-c", "password_encryption=scram-sha-256"]
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-h", "127.0.0.1"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-db
  namespace: argos-core
  labels:
    app.kubernetes.io/name: temporal-db
    app.kubernetes.io/part-of: argos
spec:
  selector:
    app.kubernetes.io/name: temporal-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-db
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 5432
