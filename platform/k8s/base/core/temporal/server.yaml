# K-03 · Temporal (ARG-007), the image and the auto-setup of the development environment: at start it
# creates or updates its schema and the namespace default. The image writes its configuration next
# to its template, so an init container of the same image copies the template to an empty volume
# mounted there, and the root of the container stays read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: argos-core
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-template
          image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
          command: ["sh", "-c", "cp -r /etc/temporal/config/. /config/"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
            - name: POSTGRES_SEEDS
              value: temporal-db
          ports:
            - name: frontend
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: argos-core
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: argos
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
---
# Only argos-services, where the API and the workers run, reaches the frontend of Temporal. The
# services of the server (frontend, history, matching, worker) talk to each other through the
# address of the pod, so the pod may reach itself; out of it, only its database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
      ports:
        - protocol: TCP
          port: 7233
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
