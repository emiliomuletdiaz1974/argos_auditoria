# K-03 · OPA of the bench (ARG-036). Without a token only /health answers, and a known client may
# only evaluate an argos.* package or list the policies (deploy/dev/opa-auth/authz.rego). OPA
# knows each client by the SHA-256 of its token, which the init container computes from the secret
# opa-clients and leaves where OPA reads its data; the token itself is never written.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: argos-core
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: client-hashes
          image: python:3.12.15-slim@sha256:29113dcae7aad06daa8e95260fa09f27d62be33b9687ea3774f771d601a02256
          command:
            - python
            - -c
            - |
              import hashlib, json, os
              token = os.environ["OPA_TOKEN_CHALLENGE"].encode()
              clients = {hashlib.sha256(token).hexdigest(): "challenge-worker"}
              with open("/clients/clients.json", "w") as out:
                  json.dump({"opa_clients": clients}, out)
          env:
            - name: OPA_TOKEN_CHALLENGE
              valueFrom:
                secretKeyRef:
                  name: opa-clients
                  key: challenge
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clients
              mountPath: /clients
      containers:
        - name: opa
          image: argos-opa
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --authentication=token
            - --authorization=basic
            - --ignore=*_test.rego
            - /policies
            - /data
            - /authz
            - /clients
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clients
              mountPath: /clients
              readOnly: true
      volumes:
        - name: clients
          emptyDir: {}
