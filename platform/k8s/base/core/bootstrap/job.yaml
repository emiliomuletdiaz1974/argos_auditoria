# K-04 · the bootstrap of the bench (bootstrap.py): migrations, dynamic database credentials and
# streams, what `make dev` did. It runs from the signed image of the API, which carries the
# migrations and the libraries; Flux recreates it when its script changes, and running it again
# changes nothing that matters. It signs in to Vault with its own service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argos-bootstrap
  namespace: argos-core
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argos-bootstrap
  namespace: argos-core
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: argos-bootstrap
    app.kubernetes.io/part-of: argos
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argos-bootstrap
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: argos-bootstrap
      # Its token is how it signs in to Vault (kubernetes auth, role bootstrap).
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: argos-api
          command: ["/app/.venv/bin/python", "/bootstrap/bootstrap.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ARGOS_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: ARGOS_NATS_PLATFORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: platform
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: argos-bootstrap
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: postgres-tls
            items:
              - key: ca.crt
                path: ca.crt
---
# It reaches PostgreSQL, NATS and Vault, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argos-bootstrap
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argos-bootstrap
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
