# K-05 · temporary passwords for the accounts of the bench (accounts.py), kept in the secret
# bench-accounts for the person; K-08, the clients of Keycloak in line with the realm; K-11, the
# accounts of the realm that are missing, and the reset of one. It may only read, create and add to
# secrets in argos-core, and it reaches only Keycloak and the API of Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-accounts
  namespace: argos-core
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-accounts
  namespace: argos-core
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-accounts
  namespace: argos-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-accounts
subjects:
  - kind: ServiceAccount
    name: keycloak-accounts
    namespace: argos-core
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-accounts
  namespace: argos-core
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: keycloak-accounts
    app.kubernetes.io/part-of: argos
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-accounts
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: keycloak-accounts
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: accounts
          image: python:3.12.15-slim@sha256:29113dcae7aad06daa8e95260fa09f27d62be33b9687ea3774f771d601a02256
          command: ["python", "/accounts/accounts.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: accounts
              mountPath: /accounts
              readOnly: true
            # K-08: the realm of the bench, to put its clients back in line (accounts.py).
            - name: realm
              mountPath: /realm
              readOnly: true
      volumes:
        - name: accounts
          configMap:
            name: keycloak-accounts
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-accounts
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-accounts
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
