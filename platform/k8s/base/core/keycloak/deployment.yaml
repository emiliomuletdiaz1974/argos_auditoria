# K-05 · Keycloak of the bench in production mode (ARG-008): `start`, never `start-dev`, prebuilt for
# PostgreSQL (argos-keycloak), with its own database reached over verified TLS. It imports the realm
# of the bench (realm-bench.json, generated by tools/bench_realm.py) only the first time; the users
# carry no credential. The temporary admin of Keycloak takes its password from a generated secret.
# HTTP inside the cluster until the bench has a domain and its TLS (K-08A, K-08).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: argos-core
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: argos-keycloak
          args:
            - start
            - --optimized
            - --import-realm
            - --http-enabled=true
          env:
            # K-08 (DP-23): the public name of the sign-in, behind Traefik, which ends the TLS. The
            # tokens carry it as their issuer wherever they are asked; the services and the Jobs of
            # the cluster keep talking to keycloak.argos-core.svc (backchannel dynamic).
            - name: KC_HOSTNAME
              value: https://id.34-134-21-66.sslip.io
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres.argos-core.svc:5432/keycloak?sslmode=verify-full&sslrootcert=/tls/ca.crt
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tls
          secret:
            secretName: postgres-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: argos-core
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: argos
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only argos-services, where the API validates tokens and exchanges codes, and the Job of the accounts
# reach Keycloak; out of it, only its database. The public entry comes with the domain of the bench (K-08).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argos-services
      ports:
        - protocol: TCP
          port: 8080
    # K-08: Traefik, for the public sign-in (only /realms and /resources, edge.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # The Job that gives the accounts of the bench their temporary passwords (accounts/).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-accounts
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
