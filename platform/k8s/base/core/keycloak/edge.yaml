# K-08 · the sign-in of the bench on its public name, only on 443. Only what a browser needs to sign
# in is published (/realms/argos and /resources); the administration console, its API and the master
# realm, which signs in the administrator of Keycloak, stay inside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: argos-core
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [id.34-134-21-66.sslip.io]
      secretName: keycloak-public-tls
  rules:
    - host: id.34-134-21-66.sslip.io
      http:
        paths:
          - path: /realms/argos
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# The ACME solver cert-manager starts here while it issues the certificate of this name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
