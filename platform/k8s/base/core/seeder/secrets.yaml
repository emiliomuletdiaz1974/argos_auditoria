# K-03 · the secrets of argos-core that the seeder creates when they are missing, with random
# values nobody sees. A secret that already exists is never changed. Add one here when a component
# of the bench needs it. `copy_to` copies it, same values, to the namespaces of its clients
# (K-06): a pod only reads secrets of its own namespace.
- name: postgres-superuser
  keys: [password]
- name: nats-users
  keys: [inventory, challenge, evidence, webhook, platform]
  copy_to: [argos-services]
- name: opa-clients
  keys: [challenge]
  copy_to: [argos-services]
- name: temporal-db
  keys: [password]
- name: evidence-store
  keys: [access, secret]
  copy_to: [argos-services]
- name: keycloak-db
  keys: [password]
- name: keycloak-admin
  keys: [password]
# K-07: the credentials of the simulated sources. The registration of the bootstrap hands them to
# Vault for the connectors (argos-core); the sources themselves read the copy.
- name: bench-sources
  keys: [smb, s3-access, s3-secret, ldap-admin, ldap-ro]
  copy_to: [bench-sources]
# K-10: the token Alertmanager delivers the alerts with, which the API checks; and the admin of Grafana.
- name: alertmanager-token
  keys: [token]
  copy_to: [argos-services]
- name: grafana-admin
  keys: [password]
