# K-03 · the secrets of argos-core that the seeder creates when they are missing, with random
# values nobody sees. A secret that already exists is never changed. Add one here when a component
# of the bench needs it. `copy_to` copies it, same values, to the namespaces of its clients
# (K-06): a pod only reads secrets of its own namespace.
- name: postgres-superuser
  keys: [password]
- name: nats-users
  keys: [inventory, challenge, evidence, webhook, platform]
  copy_to: [argos-services]
- name: opa-clients
  keys: [challenge]
  copy_to: [argos-services]
- name: temporal-db
  keys: [password]
- name: evidence-store
  keys: [access, secret]
  copy_to: [argos-services]
- name: keycloak-db
  keys: [password]
- name: keycloak-admin
  keys: [password]
