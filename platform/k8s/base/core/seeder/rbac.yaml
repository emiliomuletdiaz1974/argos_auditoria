# K-03 · the seeder may read and create secrets in argos-core, and nothing else: it cannot list them,
# change them or delete them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-seeder
  namespace: argos-core
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-seeder
  namespace: argos-core
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-seeder
  namespace: argos-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-seeder
subjects:
  - kind: ServiceAccount
    name: secret-seeder
    namespace: argos-core
