# K-03 · NATS JetStream of the bench (ARG-006), the version of the development environment. It runs
# without root and with a read-only root; JetStream keeps its streams in its volume. Each user's
# password reaches the server as an environment variable from the secret nats-users.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: argos-core
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: argos
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      # tls-reload signals the server when cert-manager renews its certificate.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          command: ["nats-server", "-c", "/etc/nats/nats.conf"]
          env:
            - name: NATS_PASSWORD_INVENTORY
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: inventory
            - name: NATS_PASSWORD_CHALLENGE
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: challenge
            - name: NATS_PASSWORD_EVIDENCE
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: evidence
            - name: NATS_PASSWORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: webhook
            - name: NATS_PASSWORD_PLATFORM
              valueFrom:
                secretKeyRef:
                  name: nats-users
                  key: platform
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /run/tls
              readOnly: true
        # Renewed at day 20 of 30 (certificate.yaml): NATS keeps the old one until it reloads.
        - name: tls-reload
          image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          command:
            - sh
            - -c
            - |
              sum() { cat /run/tls/tls.crt /run/tls/tls.key | md5sum; }
              last=$(sum)
              while sleep 60; do
                now=$(sum)
                if [ "$now" != "$last" ] && pid=$(pgrep -x nats-server) && kill -HUP "$pid"; then
                  last=$now
                  echo "certificate renewed: nats-server reloaded"
                fi
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /run/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: tls
          secret:
            secretName: nats-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
