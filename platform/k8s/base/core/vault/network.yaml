# K-03 · only the namespaces of ARGOS reach Vault, and only its API. Nothing goes out of it: the
# default denial of the namespace (default-deny.yaml) already says so.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [argos-ai, argos-connect, argos-core, argos-services]
      ports:
        - protocol: TCP
          port: 8200
