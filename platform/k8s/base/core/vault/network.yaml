# K-03 · only the namespaces of ARGOS, and cert-manager to sign certificates (K-04), reach Vault,
# and only its API. Out of it, only the API of
# Kubernetes, to review the tokens of the services that sign in (K-04); on k3s that is the address
# of the node (6443) behind the service kubernetes.default (443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault
  namespace: argos-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [argos-ai, argos-connect, argos-core, argos-services, cert-manager]
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
