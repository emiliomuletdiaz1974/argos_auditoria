# K-04 · the account of Vault may review the tokens of service accounts (TokenReview), which is how
# the kubernetes auth method knows who signs in. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: argos-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: argos-core
