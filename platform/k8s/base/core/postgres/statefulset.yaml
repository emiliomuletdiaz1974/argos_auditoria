# K-03 · PostgreSQL 16 with Apache AGE and pgvector (ARG-004), the image of the development
# environment built and signed by the workflow bench (argos-postgres). It runs as its own user from
# the start (uid 999), so the entrypoint of the image never needs root; the superuser password is
# the secret the seeder generated, and nobody has seen it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: argos-core
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: argos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: argos-postgres
          command: ["docker-entrypoint.sh"]
          args:
            - postgres
            - -c
            - shared_preload_libraries=age
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - password_encryption=scram-sha-256
          env:
            - name: POSTGRES_USER
              value: argos
            - name: POSTGRES_DB
              value: argos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "argos", "-d", "argos", "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "argos", "-d", "argos", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: hba
          configMap:
            name: postgres-hba
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
