# K-03 · PostgreSQL 16 with Apache AGE and pgvector (ARG-004), the image of the development
# environment built and signed by the workflow bench (argos-postgres). It runs as its own user from
# the start (uid 999), so the entrypoint of the image never needs root; the superuser password is
# the secret the seeder generated, and nobody has seen it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: argos-core
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: argos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: argos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: argos-postgres
          command: ["docker-entrypoint.sh"]
          args:
            - postgres
            - -c
            - shared_preload_libraries=age
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - password_encryption=scram-sha-256
            - -c
            - ssl=on
            - -c
            - ssl_min_protocol_version=TLSv1.3
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
          env:
            - name: POSTGRES_USER
              value: argos
            - name: POSTGRES_DB
              value: argos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "argos", "-d", "argos", "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "argos", "-d", "argos", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /tls
              readOnly: true
        # Renewed at day 20 of 30 (certificate.yaml): PostgreSQL keeps the old one until it reloads,
        # which it is asked for through the local socket (pg_hba: local trust).
        - name: tls-reload
          image: argos-postgres
          command:
            - sh
            - -c
            - |
              sum() { cat /tls/tls.crt /tls/tls.key | md5sum; }
              last=$(sum)
              while sleep 60; do
                now=$(sum)
                if [ "$now" != "$last" ] && psql -h /var/run/postgresql -U argos -d argos -qtAc "select pg_reload_conf()" >/dev/null; then
                  last=$now
                  echo "certificate renewed: postgres reloaded"
                fi
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: hba
          configMap:
            name: postgres-hba
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # The certificate cert-manager issues (certificate.yaml). PostgreSQL takes a key owned by
        # root only with mode 0640 or less; the group is the fsGroup of the pod.
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0640
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
