# K-03 · who may connect to PostgreSQL of the bench, and how. The socket is trusted, as in the
# development environment: whoever reaches it already runs inside the pod, and the init scripts of
# the image use it as `argos` while the process is the user postgres (so `peer` refuses them). Over
# the network every client proves its password with SCRAM. TLS on the network comes with
# cert-manager (K-06): then these `host` lines become `hostssl`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: argos-core
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: argos
data:
  pg_hba.conf: |
    local  all  all                 trust
    host   all  all  127.0.0.1/32  scram-sha-256
    host   all  all  all           scram-sha-256
