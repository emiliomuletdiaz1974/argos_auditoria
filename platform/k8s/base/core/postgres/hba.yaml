# K-03 · who may connect to PostgreSQL of the bench, and how. The socket is trusted, as in the
# development environment: whoever reaches it already runs inside the pod, and the init scripts of
# the image use it as `argos` while the process is the user postgres (so `peer` refuses them). Over
# the network, only TLS (K-04, the certificate of cert-manager) and a password proved with SCRAM;
# a connection without TLS is refused, whoever it is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: argos-core
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: argos
data:
  pg_hba.conf: |
    local  all  all                 trust
    hostssl    all  all  all  scram-sha-256
    hostnossl  all  all  all  reject
