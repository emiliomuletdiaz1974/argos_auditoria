# ARG-084 · admission of the appliance: every pod of ARGOS declares the restricted posture, or it
# does not start. Written and validated statically now (tests/security/test_k8s_manifests.py);
# applied on k3s with the hardware (F09-92). In development the same rule is a test of the compose
# (tests/security/test_compose_posture.py).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: argos-pod-baseline
  annotations:
    policies.kyverno.io/title: Restricted posture of ARGOS (ARG-084, P-22)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-restricted-posture
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [argos-core, argos-services, argos-ai, argos-connect]
      validate:
        message: "Postura restringida obligatoria (ARG-084): sin capacidades, raíz de solo lectura y sin escalada."
        pattern:
          spec:
            =(securityContext):
              =(seccompProfile):
                type: "RuntimeDefault | Localhost"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
    # K-09: not root, said by the pod for all its containers or by each container, as Kubernetes
    # allows (the bench says it on the pod); no container may say false. The first version asked it
    # of every container and would have stopped 22 workloads of the bench.
    - name: require-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [argos-core, argos-services, argos-ai, argos-connect]
      validate:
        message: "Sin root (ARG-084): runAsNonRoot en el pod o en cada contenedor, y ningún contenedor con false."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
    - name: forbid-host-access
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [argos-core, argos-services, argos-ai, argos-connect]
      validate:
        message: "hostNetwork, hostPID, hostIPC y hostPath prohibidos en ARGOS (ARG-084)."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
            =(volumes):
              - X(hostPath): "null"
