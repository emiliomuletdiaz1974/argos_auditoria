[project]
name = "argos-events"
version = "0.1.0-alpha"
description = "CloudEvents over NATS JetStream for ARGOS (ARG-006)"
requires-python = ">=3.12"
dependencies = ["argos-common", "nats-py>=2.9"]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_events"]
