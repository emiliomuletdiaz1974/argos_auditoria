[project]
name = "argos-tls"
version = "0.1.0-alpha"
description = "Mutual TLS between ARGOS services, with certificates that change without a restart (ARG-083)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_tls"]
