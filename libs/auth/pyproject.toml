[project]
name = "argos-auth"
version = "0.1.0-alpha"
description = "Validation of identities issued by the ARGOS realm (ARG-008)"
requires-python = ">=3.12"
dependencies = ["argos-common", "pyjwt[crypto]>=2.9"]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_auth"]
