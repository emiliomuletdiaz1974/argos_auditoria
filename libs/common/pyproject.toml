[project]
name = "argos-common"
version = "0.1.0-alpha"
description = "ARGOS common library: configuration, errors, logging and chained journal (ARG-001, ARG-005)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "hvac>=2.3",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_common"]
