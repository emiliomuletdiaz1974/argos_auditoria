[project]
name = "argos-comun"
version = "0.1.0-alpha"
description = "Librería común de ARGOS: configuración, errores, logging y diario encadenado (ARG-001, ARG-005)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_comun"]
