global:
  scrape_interval: 15s
  evaluation_interval: 15s

# F09-08: the alerts of the security log (ADR-0014, ENS op.exp.8).
rule_files:
  - /etc/prometheus/rules/*.yml
  # F10-03 (ARG-091): the objectives of the specification (platform/observability/rules).
  - /etc/prometheus/argos-rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The API publishes the security log as metrics: events by kind and outcome, and the chain.
  - job_name: argos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # F10-02 (ARG-094): the domain health (journal, WORM canary, queues, gates, circuits, jobs).
  - job_name: argos-health
    metrics_path: /metrics
    static_configs:
      - targets: ["health:8000"]
