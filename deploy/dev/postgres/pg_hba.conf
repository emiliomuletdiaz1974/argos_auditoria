# F09-04 · who may connect to the development database, and how.
#
# Inside the container (the entrypoint, `compose exec psql`) the socket is trusted: whoever reaches
# it already runs in the container. Every connection over the network, from the services or from
# the host through the published port, proves its password with SCRAM; nobody enters by name alone.
local   all   all                 trust
host    all   all   127.0.0.1/32  scram-sha-256
host    all   all   ::1/128       scram-sha-256
host    all   all   all           scram-sha-256
