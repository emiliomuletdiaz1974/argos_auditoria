# F09-04 · F09-06 · who may connect to the development database, and how.
#
# Inside the container (the entrypoint, `compose exec psql`) the socket is trusted: whoever reaches
# it already runs in the container. Every connection over the network, from the services or from
# the host through the published port, travels over TLS and proves its password with SCRAM; a
# connection without TLS is refused, whoever it is.
local     all   all                 trust
hostssl   all   all   127.0.0.1/32  scram-sha-256
hostssl   all   all   ::1/128       scram-sha-256
hostssl   all   all   all           scram-sha-256
hostnossl all   all   all           reject
