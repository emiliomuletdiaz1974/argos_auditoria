# ARGOS development environment. Listens on 127.0.0.1 only. Trivial credentials on purpose.
#
# Images verified on 2026-09-14 (to reproduce the environment, replace the tag with the digest):
#   grafana      grafana/grafana@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
#   keycloak     quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
#   loki         grafana/loki@sha256:e689cc634841c937de4d7ea6157f17e29cf257d6a320f1c293ab18d46cfea986
#   nats         nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
#   prometheus   prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
#   temporal     temporalio/auto-setup@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
#   temporal-db  postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
#   opa          openpolicyagent/opa@sha256:7b15f9d96345dfa639322ad97f65a0b38260f95efcdd7f5c24e284228708f06c (1.20.2)
#   vault        hashicorp/vault@sha256:74a4ab138ab5d64725e89cd9a9c73f7040c7fe49e98b71697b275ca9a69919df
#   postgres     built locally from ./postgres (base apache/age:release_PG16_1.5.0 + postgresql-16-pgvector)
#   source-postgres  postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 (postgres:16-alpine)
#   source-mariadb   mariadb@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1 (mariadb:11.4)
#   source-smb       servercontainers/samba@sha256:de2f1c141e497ea287ba099788cb4526859f0b0336214a7e7dcf89d1f90525b7 (latest, 2026-09-15)
#   source-s3        versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 (v1.8.0)
#   source-ldap      osixia/openldap@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28 (1.5.0)
#   source-fhir      hapiproject/hapi@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d (v8.10.0-3)
#   source-dicom     orthancteam/orthanc@sha256:1ca07ad4a70f67f815e55a558e76718d572ed9d0571268a3fbc1516a9155c5ca (26.9.0)
#   source-mssql     mcr.microsoft.com/mssql/server:2022-latest (heavy profile; pin the digest after the first pull)
#   source-oracle    gvenzl/oracle-free:23-slim (heavy profile; pin the digest after the first pull)
name: argos-dev

# ARG-084 · the restricted posture of every ARGOS service (P-22). Kyverno enforces the same in
# k3s (platform/k8s/security/pod-baseline.yaml); here tests/security/test_compose_posture.py
# refuses a service of ARGOS that does not declare it. The seccomp profile is Docker's default,
# except for evidence, which has its own.
x-argos-posture: &argos-posture
  user: "10001:10001"
  cap_drop: [ALL]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]

services:
  postgres:
    build: ./postgres
    image: argos-dev/postgres:16-age-vector
    # F09-04: nobody connects over the network without a password (postgres/pg_hba.conf). The
    # services connect as their own login users, members of the roles of migration 0033.
    # F09-06: TLS 1.3 only, with the certificate of cert-issuer (postgres/tls-entrypoint.sh).
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "hba_file=/etc/postgresql/pg_hba.conf",
              "-c", "ssl=on", "-c", "ssl_min_protocol_version=TLSv1.3",
              "-c", "ssl_cert_file=/var/lib/postgresql/tls/server.crt",
              "-c", "ssl_key_file=/var/lib/postgresql/tls/server.key"]
    environment:
      POSTGRES_USER: argos
      POSTGRES_DB: argos
      POSTGRES_PASSWORD: dev-only-postgres   # the superuser, for migrations and tests from the host
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data", "./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro",
              "tls-postgres:/run/tls:ro"]
    depends_on:
      cert-issuer:
        condition: service_healthy
    # The AI gateway reaches the database through its own network, with the restricted role
    # `argos_ai`; it never shares a network with the campaign API (F06-01, F06-13).
    networks: [default, ai-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argos -d argos"]
      interval: 5s
      retries: 30

  nats:
    image: nats:2.10-alpine
    # One user per service and per subject family (nats/nats.conf): nobody publishes anonymously.
    # F09-06: mutual TLS for every client; run.sh reloads the certificate when it is renewed.
    entrypoint: ["sh", "/etc/nats/run.sh"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["nats-data:/data", "./nats/nats.conf:/etc/nats/nats.conf:ro", "./nats/run.sh:/etc/nats/run.sh:ro",
              "tls-nats:/run/tls:ro"]
    depends_on:
      cert-issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      retries: 30

  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ""
      POSTGRES_SEEDS: temporal-db
    ports: ["127.0.0.1:7233:7233"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8180:8080"]   # 8180 on the host: 8080 is often taken by local web servers

  vault:
    image: hashicorp/vault:1.17
    command: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: ["IPC_LOCK"]
    ports: ["127.0.0.1:8200:8200"]
    # F09-06: the internal CA, so its database engine verifies PostgreSQL (verify-full).
    volumes: ["tls-vault:/run/tls:ro"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      retries: 30

  opa:
    image: openpolicyagent/opa:1.20.2
    # OPA decides verdicts: token authentication, and its own policy (opa-auth/authz.rego) only
    # lets known clients evaluate argos.* packages; nobody loads or reads policies over the API.
    command: ["run", "--server", "--addr", "0.0.0.0:8181",
              "--authentication=token", "--authorization=basic",
              "--ignore", "*_test.rego", "/policies", "/data", "/auth"]
    ports: ["127.0.0.1:8181:8181"]
    volumes: ["../../library/policies:/policies:ro", "./opa:/data:ro", "./opa-auth:/auth:ro"]

  prometheus:
    image: prom/prometheus:v2.54.1
    # F09-08: the configuration and the alert rules of the security log.
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./prometheus/rules:/etc/prometheus/rules:ro"]
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:3100:3100"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/argos.yaml:ro"]
    ports: ["127.0.0.1:3000:3000"]

  example:
    <<: *argos-posture
    build:
      context: ../..
      dockerfile: services/example/Dockerfile
    environment:
      # F09-05: an ephemeral user that Vault issues and the service renews (argos_common.dynamic_db).
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      ARGOS_DATABASE_VAULT_ROLE: svc-example
      ARGOS_VAULT_APPROLE_DIR: /run/secrets/approle
      PGSERVICEFILE: /tmp/argos-db/pg_service.conf   # where libpq reads the credential
      # F09-06 (ARG-083): its certificate, key and the internal CA (the connection string verifies
      # PostgreSQL; PGSSLMODE is not used because it would also reach the sources of the client).
      ARGOS_TLS_DIR: /run/tls
      ARGOS_VAULT_ADDR: http://vault:8200
      ARGOS_LOG_LEVEL: INFO
    volumes: ["./secrets/approle-example:/run/secrets/approle:ro", "tls-example:/run/tls:ro"]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      retries: 30

  # ── Campaign engine (F05-17): one image, the worker and the API as two entry points. ──
  challenge-worker:
    <<: *argos-posture
    build: &challenge_engine_build
      context: ../..
      dockerfile: services/challenge-engine/Dockerfile
    image: argos-challenge-engine:dev
    volumes: ["./secrets/approle-challenge:/run/secrets/approle:ro", "tls-challenge:/run/tls:ro"]
    command: ["/app/.venv/bin/python", "-m", "argos_challenges.worker"]
    environment: &challenge_engine_env
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      ARGOS_DATABASE_VAULT_ROLE: svc-challenge
      ARGOS_VAULT_APPROLE_DIR: /run/secrets/approle
      PGSERVICEFILE: /tmp/argos-db/pg_service.conf   # where libpq reads the credential
      # F09-06 (ARG-083): its certificate, key and the internal CA (the connection string verifies
      # PostgreSQL; PGSSLMODE is not used because it would also reach the sources of the client).
      ARGOS_TLS_DIR: /run/tls
      ARGOS_TEMPORAL_ADDRESS: temporal:7233
      ARGOS_NATS_URL: tls://nats:4222
      ARGOS_NATS_USER: challenge
      ARGOS_NATS_PASSWORD: dev-only-nats-challenge
      ARGOS_OPA_URL: http://opa:8181
      ARGOS_OPA_TOKEN: dev-only-opa-challenge
      ARGOS_VAULT_ADDR: http://vault:8200
      ARGOS_VAULT_TOKEN: root   # development Vault started with -dev-root-token-id=root
      # The container validates tokens issued through the internal address; from the host,
      # Keycloak answers on 127.0.0.1:8180 and the issuers would not match.
      ARGOS_OIDC_ISSUER: http://keycloak:8080/realms/argos
      ARGOS_OIDC_AUDIENCE: argos-api
      ARGOS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      vault:
        condition: service_healthy
      opa:
        condition: service_started

  # ── F09-06 (ARG-083): issues and renews the certificate of every ARGOS service from Vault's
  # internal CA (30 days, renewed at 20). Each certificate goes to a volume only its service mounts.
  cert-issuer:
    <<: *argos-posture
    build:   # the image of the API, which carries argos_tls
      context: ../..
      dockerfile: services/api/Dockerfile
    image: argos-api:dev
    command: ["/app/.venv/bin/python", "-m", "argos_tls.issuer"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_DIR: /run/secrets/approle
      ARGOS_TLS_ROOT: /certs
      ARGOS_TLS_SERVICES: "api=api;webhook=webhook;challenge=challenge;evidence=evidence;ai-gateway=ai-gateway;example=example;postgres=postgres;nats=nats;vault=vault"
    volumes: ["./secrets/approle-cert-issuer:/run/secrets/approle:ro", "tls-api:/certs/api", "tls-webhook:/certs/webhook", "tls-challenge:/certs/challenge", "tls-evidence:/certs/evidence", "tls-ai-gateway:/certs/ai-gateway", "tls-example:/certs/example", "tls-postgres:/certs/postgres", "tls-nats:/certs/nats", "tls-vault:/certs/vault"]
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import pathlib, sys; sys.exit(not (pathlib.Path('/certs/api/tls.crt').exists() and pathlib.Path('/certs/webhook/tls.crt').exists() and pathlib.Path('/certs/challenge/tls.crt').exists() and pathlib.Path('/certs/evidence/tls.crt').exists() and pathlib.Path('/certs/ai-gateway/tls.crt').exists() and pathlib.Path('/certs/example/tls.crt').exists() and pathlib.Path('/certs/postgres/tls.crt').exists() and pathlib.Path('/certs/nats/tls.crt').exists() and pathlib.Path('/certs/vault/tls.crt').exists()))"]
      interval: 2s
      retries: 60

  # ── The single API (ADR-0012) with the console inside (ADR-0013). The campaign API of Phase 05
  # is gone: its routes live under /api/v1. It is the only service that reaches the AI gateway. ──
  api:
    <<: *argos-posture
    build: &api_build
      context: ../..
      dockerfile: services/api/Dockerfile
    image: argos-api:dev
    volumes: ["./secrets/approle-api:/run/secrets/approle:ro", "tls-api:/run/tls:ro", "./update:/var/lib/argos/update", "./support:/var/lib/argos/support"]
    command: ["/app/.venv/bin/python", "-m", "argos_api.main"]
    environment: &api_env
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      ARGOS_DATABASE_VAULT_ROLE: svc-api
      ARGOS_VAULT_APPROLE_DIR: /run/secrets/approle
      PGSERVICEFILE: /tmp/argos-db/pg_service.conf   # where libpq reads the credential
      # F09-06 (ARG-083): its certificate, key and the internal CA (the connection string verifies
      # PostgreSQL; PGSSLMODE is not used because it would also reach the sources of the client).
      ARGOS_TLS_DIR: /run/tls
      ARGOS_TEMPORAL_ADDRESS: temporal:7233
      ARGOS_VAULT_ADDR: http://vault:8200
      ARGOS_VAULT_TOKEN: root   # development Vault started with -dev-root-token-id=root
      # The container validates tokens issued through the internal address; from the host,
      # Keycloak answers on 127.0.0.1:8180 and the issuers would not match.
      ARGOS_OIDC_ISSUER: http://keycloak:8080/realms/argos
      ARGOS_OIDC_AUDIENCE: argos-api
      # The assistant is the one thing the API asks another service for, over HTTP (ADR-0012).
      ARGOS_AI_GATEWAY_URL: https://ai-gateway:8005   # mutual TLS (F09-06)
      # F09-10 (ARG-086): the API verifies a bundle of the inbox and queues it for the updater.
      ARGOS_UPDATE_DIR: /var/lib/argos/update
      ARGOS_RELEASE_PUBLIC_KEY_FILE: /var/lib/argos/update/release.pub
      # F09-11 (ARG-088): the API queues diagnostic requests, shows the previews the collector
      # leaves and encrypts the approved one for the key of support (a test key here).
      ARGOS_SUPPORT_DIR: /var/lib/argos/support
      ARGOS_SUPPORT_RECIPIENT_FILE: /var/lib/argos/support/support.pub
      ARGOS_EVIDENCE_ISSUER_DID: did:web:127.0.0.1%3A8008
      ARGOS_EVIDENCE_STATUS_BASE_URL: http://127.0.0.1:8008/status
      ARGOS_EVIDENCE_CREDENTIAL_BASE_URL: http://127.0.0.1:8008/credentials
      ARGOS_EVIDENCE_VERIFIER_URL: http://127.0.0.1:8007/verify
      ARGOS_EVIDENCE_RETENTION_DAYS: "1"
      ARGOS_EVIDENCE_S3_ENDPOINT: http://evidence-store:7070
      ARGOS_EVIDENCE_S3_ACCESS_KEY: dev-only-evidence
      ARGOS_EVIDENCE_S3_SECRET_KEY: dev-only-evidence-secret
      ARGOS_EVIDENCE_TSA_URL: http://tsa:3180
      ARGOS_EVIDENCE_TSA_ROOTS_URL: http://tsa:3180/ca.pem
      ARGOS_LOG_LEVEL: INFO
      ARGOS_API_BIND: 0.0.0.0   # published below on 127.0.0.1 only
    # `ai` gives it the gateway; the campaign worker is not on that network and never will be.
    networks: [default, ai, evidence]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
      evidence-store:
        condition: service_started
      tsa:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      retries: 30

  # The deliveries towards the ITSM (ARG-079): the bus writes them, Temporal retries them. Nothing
  # is delivered from the request that caused it.
  webhook-worker:
    <<: *argos-posture
    build: *api_build
    image: argos-api:dev
    volumes: ["./secrets/approle-webhook:/run/secrets/approle:ro", "tls-webhook:/run/tls:ro"]
    command: ["/app/.venv/bin/python", "-m", "argos_api.webhooks.worker"]
    environment:
      <<: *api_env
      ARGOS_DATABASE_VAULT_ROLE: svc-webhook
      # Only the worker listens on the bus; the API itself neither publishes nor subscribes.
      ARGOS_NATS_URL: tls://nats:4222
      ARGOS_NATS_USER: webhook
      ARGOS_NATS_PASSWORD: dev-only-nats-webhook
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      nats:
        condition: service_started
      vault:
        condition: service_healthy

  # ── Evidence (F07-04): the WORM store, VersityGW with object lock (ADR-0010). Development keeps a
  # one-day default retention; resetting it means dropping the `evidence-data` volume. ──
  evidence-store:
    image: versity/versitygw:v1.8.0
    entrypoint: ["sh", "-c", "mkdir -p /data/objects /data/versions && exec versitygw --access dev-only-evidence --secret dev-only-evidence-secret posix --versioning-dir /data/versions /data/objects"]
    volumes: ["evidence-data:/data"]
    networks: [evidence]
    ports: ["127.0.0.1:7075:7070"]

  # Development time stamping authority (F07-08, deviation note ARG-064-065): RFC 3161 by
  # `openssl ts` with a test CA made on first start and kept in its volume. Not qualified.
  tsa:
    build: ./tsa
    image: argos-dev/tsa:dev
    volumes: ["tsa-data:/data"]
    networks: [evidence]
    ports: ["127.0.0.1:3180:3180"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3180/health', timeout=2)"]
      interval: 5s
      retries: 30

  # Evidence service (F07-13): the worker listens for sealed campaigns on NATS and carries each one
  # to its credential; the API publishes only what verification needs (DID, status lists,
  # credentials). Both reach the WORM store, the TSA and the EDC on the evidence network.
  evidence-worker:
    <<: *argos-posture
    security_opt: ["no-new-privileges:true", "seccomp=../../platform/k8s/security/seccomp/evidence.json"]
    build: &evidence_build
      context: ../..
      dockerfile: services/evidence/Dockerfile
    image: argos-evidence:dev
    volumes: ["./secrets/approle-evidence:/run/secrets/approle:ro", "tls-evidence:/run/tls:ro"]
    command: ["/app/.venv/bin/python", "-m", "argos_evidence.worker"]
    environment: &evidence_env
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      ARGOS_DATABASE_VAULT_ROLE: svc-evidence
      ARGOS_VAULT_APPROLE_DIR: /run/secrets/approle
      PGSERVICEFILE: /tmp/argos-db/pg_service.conf   # where libpq reads the credential
      # F09-06 (ARG-083): its certificate, key and the internal CA (the connection string verifies
      # PostgreSQL; PGSSLMODE is not used because it would also reach the sources of the client).
      ARGOS_TLS_DIR: /run/tls
      ARGOS_TEMPORAL_ADDRESS: temporal:7233
      ARGOS_NATS_URL: tls://nats:4222
      ARGOS_NATS_USER: evidence
      ARGOS_NATS_PASSWORD: dev-only-nats-evidence
      ARGOS_VAULT_ADDR: http://vault:8200
      ARGOS_VAULT_TOKEN: root   # development Vault started with -dev-root-token-id=root
      ARGOS_LOG_LEVEL: INFO
      ARGOS_EVIDENCE_ISSUER_DID: did:web:127.0.0.1%3A8008
      ARGOS_EVIDENCE_STATUS_BASE_URL: http://127.0.0.1:8008/status
      ARGOS_EVIDENCE_CREDENTIAL_BASE_URL: http://127.0.0.1:8008/credentials
      ARGOS_EVIDENCE_VERIFIER_URL: http://127.0.0.1:8007/verify
      ARGOS_EVIDENCE_RETENTION_DAYS: "1"
      ARGOS_EVIDENCE_S3_ENDPOINT: http://evidence-store:7070
      ARGOS_EVIDENCE_S3_ACCESS_KEY: dev-only-evidence
      ARGOS_EVIDENCE_S3_SECRET_KEY: dev-only-evidence-secret
      ARGOS_EVIDENCE_TSA_URL: http://tsa:3180
      ARGOS_EVIDENCE_TSA_ROOTS_URL: http://tsa:3180/ca.pem
      ARGOS_EVIDENCE_STAMP_ATTEMPTS: "12"
      ARGOS_EVIDENCE_STAMP_WAIT_SECONDS: "5"
    networks: [default, evidence]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      nats:
        condition: service_started
      evidence-store:
        condition: service_started
      tsa:
        condition: service_healthy

  evidence-api:
    <<: *argos-posture
    security_opt: ["no-new-privileges:true", "seccomp=../../platform/k8s/security/seccomp/evidence.json"]
    build: *evidence_build
    image: argos-evidence:dev
    volumes: ["./secrets/approle-evidence:/run/secrets/approle:ro", "tls-evidence:/run/tls:ro"]
    command: ["/app/.venv/bin/python", "-m", "argos_evidence.api"]
    environment:
      <<: *evidence_env
      ARGOS_API_BIND: 0.0.0.0   # published below on 127.0.0.1 only
    networks: [default, evidence]
    depends_on:
      postgres:
        condition: service_healthy
      evidence-store:
        condition: service_started
      tsa:
        condition: service_healthy
    ports: ["127.0.0.1:8008:8008"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"]
      interval: 5s
      retries: 30

  # Simulated EDC Management API (F07-12): only what ARGOS uses, bodies checked, state in memory.
  # The real connector (and Gaia-X, Pontus-X) arrive with F07-16. Development key, trivial on purpose.
  edc-mock:
    build: ./edc-mock
    image: argos-dev/edc-mock:dev
    environment:
      EDC_API_KEY: dev-only-edc-key
    networks: [evidence]
    ports: ["127.0.0.1:19193:19193"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19193/health', timeout=2)"]
      interval: 5s
      retries: 30

  # Public verifier (F07-11): checks an evidence bundle with nothing but what it carries. It has its
  # own network and reaches no other service: no database, no store, no secret.
  verifier:
    <<: *argos-posture
    build:
      context: ../..
      dockerfile: services/verifier/Dockerfile
    image: argos-verifier:dev
    environment:
      ARGOS_API_BIND: 0.0.0.0   # published below on 127.0.0.1 only
      # What it trusts (issuer key, TSA root): written by `make dev`, never taken from a bundle.
      ARGOS_VERIFIER_TRUST_FILE: /etc/argos-verifier/trust.json
    volumes: ["./verifier:/etc/argos-verifier:ro"]
    networks: [verifier]
    ports: ["127.0.0.1:8007:8007"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=2)"]
      interval: 5s
      retries: 30

  # ── AI layer (F06-13): the gateway on its own networks, never on the one of the campaign API. ──
  # F09-05: renews the gateway's database credential from Vault, which the gateway cannot reach.
  # Same code as inside the other services (argos_common.dynamic_db), as a process of its own.
  ai-db-credentials:
    <<: *argos-posture
    image: argos-api:dev
    pull_policy: never   # built by the api service
    command: ["/app/.venv/bin/python", "-m", "argos_common.dynamic_db"]
    environment:
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos   # required by the configuration; it does not connect
      ARGOS_DATABASE_VAULT_ROLE: svc-ai-gateway
      ARGOS_VAULT_APPROLE_DIR: /run/secrets/approle
      ARGOS_DATABASE_SERVICE_FILE: /run/argos-db/pg_service.conf
      PGSERVICEFILE: /run/argos-db/pg_service.conf
      ARGOS_VAULT_ADDR: http://vault:8200
      ARGOS_LOG_LEVEL: INFO
    volumes: ["./secrets/approle-ai-gateway:/run/secrets/approle:ro", "ai-db-credentials:/run/argos-db"]
    depends_on:
      vault:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import pathlib, sys; sys.exit(not pathlib.Path('/run/argos-db/pg_service.conf').exists())"]
      interval: 2s
      retries: 30

  ai-gateway:
    <<: *argos-posture
    build:
      context: ../..
      dockerfile: services/ai-gateway/Dockerfile
    image: argos-ai-gateway:dev
    volumes: ["ai-db-credentials:/run/argos-db:ro", "tls-ai-gateway:/run/tls:ro"]
    environment:
      # An ephemeral member of svc_ai_gateway: it reads what its tools use, writes its own tables
      # and appends to the journal; it cannot touch a verdict or a finding (F06-01, F09-04). The
      # gateway does not reach Vault: ai-db-credentials renews the user and leaves it in the
      # volume, where libpq reads it for every new connection (F09-05).
      ARGOS_DATABASE_URL: postgresql://postgres:5432/argos?service=argos&sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      PGSERVICEFILE: /run/argos-db/pg_service.conf
      # F09-06 (ARG-083): its certificate, key and the internal CA (the connection string verifies
      # PostgreSQL; PGSSLMODE is not used because it would also reach the sources of the client).
      ARGOS_TLS_DIR: /run/tls
      ARGOS_LLM_LOCAL_ENDPOINT: http://llm:8080/v1
      ARGOS_LLM_MODEL: argos-llm
      ARGOS_API_BIND: 0.0.0.0   # published below on 127.0.0.1 only
      ARGOS_LOG_LEVEL: INFO
    networks: [ai, ai-data]
    depends_on:
      postgres:
        condition: service_healthy
      ai-db-credentials:
        condition: service_healthy
    ports: ["127.0.0.1:8005:8005"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import sys; from argos_tls import mtls_client; sys.exit(mtls_client('/run/tls', timeout=2).get('https://localhost:8005/health').status_code != 200)"]
      interval: 5s
      retries: 30

  # The local model server (ADR-0009): llama.cpp over CPU with the OpenAI-compatible API. It has
  # its own profile because it needs the weights of F06-05; without them `make dev` still works.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--alias", "argos-llm"]
    volumes: ["./models:/models:ro"]
    networks: [ai]
    ports: ["127.0.0.1:8004:8080"]

  # ── Simulated customer sources (F02-04). Profile "sources" is part of make dev. ──
  source-postgres:
    image: postgres:16-alpine
    profiles: ["sources"]
    command: ["postgres", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%p] user=%u db=%d "]
    environment:
      POSTGRES_USER: owner
      POSTGRES_DB: clinic
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: ["./sources/postgres:/docker-entrypoint-initdb.d:ro"]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d clinic"]
      interval: 5s
      retries: 30

  source-mariadb:
    image: mariadb:11.4
    profiles: ["sources"]
    command: ["--general-log=1", "--log-output=TABLE"]
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: billing
    volumes: ["./sources/mariadb:/docker-entrypoint-initdb.d:ro"]
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # ── File and directory sources (F02-08). Data generated by tools/prepare_dev_sources.py. ──
  source-smb:
    image: servercontainers/samba:latest
    profiles: ["sources"]
    environment:
      ACCOUNT_argos_ro: "dev-only-smb"
      UID_argos_ro: "1000"
      SAMBA_VOLUME_CONFIG_clinical: "[clinical]; path=/shares/clinical; valid users = argos_ro; guest ok = no; read only = yes; browseable = yes"
    volumes: ["./sources/files/clinical:/shares/clinical:ro"]
    ports: ["127.0.0.1:1445:445"]

  source-s3:
    image: versity/versitygw:v1.8.0
    profiles: ["sources"]
    command: ["--access", "dev-only-access", "--secret", "dev-only-secret-key", "--port", ":7070", "--readonly", "posix", "/data"]
    volumes: ["./sources/s3:/data:ro"]
    ports: ["127.0.0.1:7070:7070"]

  source-ldap:
    image: osixia/openldap:1.5.0
    profiles: ["sources"]
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Synthetic Hospital"
      LDAP_DOMAIN: hosp.local
      LDAP_ADMIN_PASSWORD: "dev-only-admin"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: argos_ro
      LDAP_READONLY_USER_PASSWORD: "dev-only-ldap"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: server.crt
      LDAP_TLS_KEY_FILENAME: server.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_LOG_LEVEL: "256"
    volumes:
      - "./sources/certs:/container/service/slapd/assets/certs:ro"
      - "./sources/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro"
    ports: ["127.0.0.1:1636:636"]

  # ── Clinical sources (F02-12). Seeded by tools/seed_dev_clinical.py. ──
  source-fhir:
    image: hapiproject/hapi:v8.10.0-3
    profiles: ["sources"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    ports: ["127.0.0.1:8090:8080"]

  source-dicom:
    image: orthancteam/orthanc:26.9.0
    profiles: ["sources"]
    environment:
      ORTHANC__NAME: argos-dev-pacs
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_AET: ORTHANC
      ORTHANC__DICOM_CHECK_CALLED_AET: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_MOVE: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_GET: "false"
    ports: ["127.0.0.1:4242:4242", "127.0.0.1:8042:8042"]

  # ── Heavy sources: make dev-heavy only (several GB of images and RAM). ──
  source-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["heavy"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Dev-Only-Sa-2026"
    volumes: ["./sources/mssql:/init:ro"]
    ports: ["127.0.0.1:51433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 30

  source-oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["heavy"]
    environment:
      ORACLE_PASSWORD: "dev-only-oracle"
      APP_USER: his_owner
      APP_USER_PASSWORD: "dev-only-his"
    volumes: ["./sources/oracle:/container-entrypoint-initdb.d:ro"]
    ports: ["127.0.0.1:51521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60


networks:
  default:
  ai:
  ai-data:
  evidence:
  verifier:

volumes:
  pg-data:
  # F09-06: one certificate volume per service, in memory; only cert-issuer and its service mount it.
  tls-api:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-webhook:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-challenge:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-evidence:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-ai-gateway:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-example:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-postgres:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-nats:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  tls-vault:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0755"}
  # The gateway's database credential: in memory, readable only by the container user.
  ai-db-credentials:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  nats-data:
  evidence-data:
  tsa-data:
