[project]
name = "argos-platform"
version = "0.1.0-alpha"
description = "Sovereign regulatory compliance verification platform (GDPR, EHDS, AI Act, ENS)"
requires-python = ">=3.12"
dependencies = ["argos-auth", "argos-challenge-engine", "argos-common", "argos-connector-sdk", "argos-events", "argos-example"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["connectors/sdk", "libs/auth", "libs/common", "libs/events", "services/challenge-engine", "services/example"]

[tool.uv.sources]
argos-auth = { workspace = true }
argos-challenge-engine = { workspace = true }
argos-common = { workspace = true }
argos-connector-sdk = { workspace = true }
argos-events = { workspace = true }
argos-example = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-hvac>=2.4.0.20260731",
    "pymysql>=1.2",
    "pymssql>=2.4",
    "oracledb>=3",
]

[tool.pytest.ini_options]
testpaths = ["libs", "connectors", "tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the make dev environment", "heavy: requires make dev-heavy (SQL Server and Oracle)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["argos_auth", "argos_challenges", "argos_common", "argos_connector", "argos_events", "argos_example"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
