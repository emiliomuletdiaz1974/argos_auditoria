# Población RGPD del v1 (F04-12). Pendiente de validación jurídica (F04-13).
id: OBL-RGPD-32-3
norma: RGPD
articulo: "32.1.b"
titulo: "Cifrado en tránsito hacia los sistemas con datos personales"
