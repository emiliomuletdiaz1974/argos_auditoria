# Población EHDS del v1 (F04-14). Pendiente de validación jurídica (F04-15).
id: OBL-EHDS-60-1
norma: EHDS
articulo: "60.2"
titulo: "Datos puestos a disposición del organismo de acceso en plazo"
vigente_desde: 2029-03-26
severidad: medium
texto_resumen: "Tras una petición del organismo de acceso a datos de salud, el tenedor pone a su disposición los datos solicitados en un máximo de tres meses."
aplica_a:
  - AC-stored-health-data
pendiente_verificacion: "El plazo solo puede medirse con peticiones reales o simuladas del organismo de acceso, que no existe todavía en el entorno del cliente."
