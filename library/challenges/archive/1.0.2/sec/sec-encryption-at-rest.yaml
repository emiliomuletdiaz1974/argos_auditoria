# Cifrado en reposo. En PostgreSQL no hay parámetro nativo que lo acredite: la sonda pregunta y, si
# el motor no responde, el veredicto es "inconclusive", nunca "compliant" (ver §9 del módulo).
id: sec-encryption-at-rest
version: "1.0"
title: Cifrado en reposo verificado en el almacén de datos
objective:
  obligation: OBL-RGPD-32-1
selector:
  asset_class: AC-stored-special-category-data
probe:
  kind: check_config
  by_connector:
    rdbms.postgresql:
      statement: SELECT setting FROM pg_settings WHERE name = 'encryption_at_rest'
    rdbms.generic:
      statement: SELECT LOWER(@@global.innodb_encrypt_tables) AS setting
criterion:
  threshold:
    field: rows.0.setting
    operator: "=="
    value: "on"
evidence:
  capture: [configuration]
  minimisation: >-
    Solo el parámetro de cifrado del motor; ninguna clave, ninguna cadena de conexión y ningún
    dato de negocio.
severity: critical
estimated_cost:
  probes: 1
  rows: 1
