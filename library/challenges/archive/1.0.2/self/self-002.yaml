id: self-002
version: "1.0"
title: El registro de seguridad del appliance verifica su cadena
objective:
  obligation: OBL-SELF-3-8-1
selector:
  asset_class: AC-argos-appliance
probe:
  kind: check_config
  by_connector:
    rdbms.postgresql:
      statement: SELECT setting FROM argos_facts.facts WHERE fact = 'security_log_intact'
criterion:
  threshold:
    field: rows.0.setting
    operator: "=="
    value: "true"
evidence:
  capture: [configuration]
  minimisation: >-
    Solo el resultado de la verificación; ningún evento, actor ni detalle.
severity: critical
estimated_cost:
  probes: 1
  rows: 1
