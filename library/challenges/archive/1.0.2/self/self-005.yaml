id: self-005
version: "1.0"
title: El appliance tiene en vigor un bundle de contenido firmado
objective:
  obligation: OBL-SELF-3-3-1
selector:
  asset_class: AC-argos-appliance
probe:
  kind: check_config
  by_connector:
    rdbms.postgresql:
      statement: SELECT setting FROM argos_facts.facts WHERE fact = 'signed_content_in_force'
criterion:
  threshold:
    field: rows.0.setting
    operator: "=="
    value: "true"
evidence:
  capture: [configuration]
  minimisation: >-
    Solo si hay un bundle firmado en vigor; ni su contenido ni su firma.
severity: high
estimated_cost:
  probes: 1
  rows: 1
