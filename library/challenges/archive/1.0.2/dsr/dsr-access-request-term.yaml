# Mide el plazo de respuesta con las fechas que el cliente declara al confirmar el ejercicio del
# derecho sobre el sujeto sintético de la campaña (solicitud y respuesta). Si el derecho no se
# ejerció contra ese sistema no hay respuesta que medir: "inconclusive".
id: dsr-access-request-term
version: "1.0"
title: Plazo de respuesta a la solicitud de acceso del interesado
objective:
  obligation: OBL-RGPD-15-1
selector:
  asset_class: AC-stored-personal-data
probe:
  kind: inventory_query
  params:
    query: access_request_days
criterion:
  threshold:
    field: count
    operator: "<="
    value: 30
evidence:
  capture: [counts]
  minimisation: >-
    Solo los días entre la solicitud y la respuesta que declara el cliente para el sujeto
    sintético de la campaña; ninguna solicitud real y ningún dato de personas reales.
severity: high
preconditions: [synthetic_subject_injected]
estimated_cost:
  probes: 1
  rows: 1
