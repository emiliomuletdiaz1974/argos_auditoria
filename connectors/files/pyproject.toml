[project]
name = "argos-connector-files"
version = "0.1.0-alpha"
description = "ARGOS file connector for SMB, NFS mounts and S3 (ARG-017)"
requires-python = ">=3.12"
dependencies = ["argos-connector-sdk", "smbprotocol>=1.17", "boto3>=1.43"]

[tool.uv.sources]
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_files"]
