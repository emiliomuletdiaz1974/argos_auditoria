[project]
name = "argos-connector-dicom"
version = "0.1.0-alpha"
description = "ARGOS DICOM connector: C-ECHO and C-FIND only (ARG-020)"
requires-python = ">=3.12"
dependencies = ["argos-connector-sdk", "pynetdicom>=3.0.4", "pydicom>=3.0.2"]

[tool.uv.sources]
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_dicom"]
