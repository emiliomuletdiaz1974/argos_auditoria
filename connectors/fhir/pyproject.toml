[project]
name = "argos-connector-fhir"
version = "0.1.0-alpha"
description = "ARGOS FHIR R4 connector on top of the declarative REST connector (ARG-020)"
requires-python = ">=3.12"
dependencies = ["argos-connector-rest"]

[tool.uv.sources]
argos-connector-rest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_fhir"]
