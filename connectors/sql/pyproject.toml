[project]
name = "argos-connector-sql"
version = "0.1.0-alpha"
description = "ARGOS SQL connectors: generic, PostgreSQL, Oracle and SQL Server (ARG-014..016)"
requires-python = ">=3.12"
dependencies = ["argos-connector-sdk", "sqlalchemy>=2.0.53,<2.1", "pymysql>=1.2"]

[tool.uv.sources]
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_sql"]
