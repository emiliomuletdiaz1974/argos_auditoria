[project]
name = "argos-connector-rest"
version = "0.1.0-alpha"
description = "ARGOS declarative REST connector: safe methods and exact route allowlist (ARG-019)"
requires-python = ">=3.12"
dependencies = ["argos-connector-sdk", "httpx>=0.28"]

[tool.uv.sources]
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_rest"]
