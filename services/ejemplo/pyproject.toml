[project]
name = "argos-ejemplo"
version = "0.1.0-alpha"
description = "Servicio de ejemplo de la Fase 1: patrón de arranque, salud y diario"
requires-python = ">=3.12"
dependencies = ["argos-comun", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
argos-comun = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_ejemplo"]
