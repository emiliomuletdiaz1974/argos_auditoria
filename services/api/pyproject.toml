[project]
name = "argos-api"
version = "0.1.0-alpha"
description = "ARGOS single authenticated API, v1 (ARG-071…080)"
requires-python = ">=3.12"
dependencies = [
    "argos-auth",
    "argos-challenge-engine",
    "argos-common",
    "argos-inventory",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
argos-auth = { workspace = true }
argos-challenge-engine = { workspace = true }
argos-common = { workspace = true }
argos-inventory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_api"]
