[project]
name = "argos-api"
version = "0.1.0-alpha"
description = "ARGOS single authenticated API, v1 (ARG-071…080)"
requires-python = ">=3.12"
dependencies = [
    "argos-tls",
    "argos-auth",
    "argos-challenge-engine",
    "argos-common",
    "argos-evidence",
    "argos-inventory",
    "argos-ontology",
    "argos-support",
    "argos-updater",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "temporalio>=1.8",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
argos-tls = { workspace = true }
argos-auth = { workspace = true }
argos-challenge-engine = { workspace = true }
argos-common = { workspace = true }
argos-evidence = { workspace = true }
argos-inventory = { workspace = true }
argos-ontology = { workspace = true }
argos-support = { workspace = true }
argos-updater = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_api"]
