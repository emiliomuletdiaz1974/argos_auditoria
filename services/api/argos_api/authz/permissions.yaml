# ARG-072 · the authorisation matrix of the v1: permission -> realm roles that hold it.
#
# It is versioned here so the client can read it, review it and challenge it. Nothing else grants
# access: a route asks for a permission, and a permission that is not in this file is a start-up
# error, never an open door. Deny by default.
#
# Separation of duties, as the RACI of the contract requires:
#   - whoever plans and launches a campaign (campaign_manager) does not approve its gates nor moves
#     its findings: that is the DPO reviewer;
#   - platform_admin operates the platform (integrations, revocation) and neither approves nor
#     judges: administering is not deciding;
#   - read_only_auditor only holds `.read` permissions;
#   - issuing a credential is an explicit act of the DPO reviewer, who reads its preview first;
#   - the integrations with the ITSM (webhooks) are the platform admin's alone.
# The double control of the sampling gate (two different people) is the one of ARG-047 and lives in
# the campaign engine, not here.

# Roles no single person may hold together, whatever the realm assigns: a token that carries both is
# refused on every route (security review F09-02, SEC-008). The engine also refuses that whoever
# created a campaign approves it, and that whoever authorised an injection confirms it.
_incompatible_roles:
  - [campaign_manager, dpo_reviewer]

# The permissions that decide ask for a second factor (F09-07, DP-14): a token without `otp` in its
# `amr` gets 401 with `error="insufficient_user_authentication"` (RFC 9470) and the console asks the
# person to sign in again with their code. Only roles whose people have TOTP may hold them.
_second_factor:
  - campaigns.approve
  - findings.transition
  - credentials.create
  - credentials.revoke
  - synthetic.authorize
  - inventory.review
  - webhooks.create
  - system.update
  - support.package

systems.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]

inventory.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]
inventory.review: [dpo_reviewer]

campaigns.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]
campaigns.create: [campaign_manager]
campaigns.launch: [campaign_manager]
campaigns.approve: [dpo_reviewer]
campaigns.remediate: [campaign_manager]
# ADR-0008: the DPO authorises an injection point of the synthetic subject; the client —through the
# campaign manager— confirms each step it really did. Never the same person for both.
synthetic.authorize: [dpo_reviewer]
synthetic.confirm: [campaign_manager]
approvals.read: [campaign_manager, dpo_reviewer]

findings.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]
findings.transition: [dpo_reviewer]
findings.verify: [campaign_manager]

evidence.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]

credentials.read: [platform_admin, campaign_manager, dpo_reviewer, read_only_auditor]
credentials.create: [dpo_reviewer]
credentials.revoke: [platform_admin]

assistant.ask: [platform_admin, campaign_manager, dpo_reviewer]

webhooks.read: [platform_admin]
webhooks.create: [platform_admin]

# F09-08: who tried what (the security log): the administrator and the auditor, reading only.
security.read: [platform_admin, read_only_auditor]

# F09-10 (ARG-086): asking the updater to apply a verified bundle: the platform administrator,
# with the second factor. The updater applies it; the API only verifies and queues.
system.update: [platform_admin]

# F09-11 (ARG-088): the diagnostic package. The administrator asks for it and reads it; encrypting
# it for support, which is what leaves the appliance, also asks for the second factor.
support.diagnose: [platform_admin]
support.package: [platform_admin]
