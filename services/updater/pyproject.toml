[project]
name = "argos-updater"
version = "0.1.0-alpha"
description = "Transactional signed updater with its reverse plan written first (ARG-086)"
requires-python = ">=3.12"
dependencies = ["argos-common", "argos-ontology"]

[project.scripts]
argos-update = "argos_updater.cli:main"

[tool.uv.sources]
argos-common = { workspace = true }
argos-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_updater"]
