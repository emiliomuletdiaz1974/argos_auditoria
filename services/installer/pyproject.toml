[project]
name = "argos-installer"
version = "0.1.0-alpha"
description = "The installer of week 1: guided steps, each verified, with a signed report (ARG-096)"
requires-python = ">=3.12"
dependencies = ["argos-common", "cryptography>=43", "pydantic>=2.9", "pyyaml>=6.0"]

[project.scripts]
argos-install = "argos_installer.cli:main"

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_installer"]
