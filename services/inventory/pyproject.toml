[project]
name = "argos-inventory"
version = "0.1.0-alpha"
description = "ARGOS inventory and knowledge graph on PostgreSQL + Apache AGE (ARG-021..030)"
requires-python = ">=3.12"
dependencies = ["argos-common"]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_inventory"]
