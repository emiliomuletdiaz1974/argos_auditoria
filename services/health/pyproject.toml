[project]
name = "argos-health"
version = "0.1.0-alpha"
description = "Domain health service: what no standard exporter measures (ARG-094)"
requires-python = ">=3.12"
dependencies = ["argos-common", "argos-evidence", "boto3>=1.43", "cryptography>=43", "fastapi>=0.115", "psycopg[binary]>=3.2", "pydantic-settings>=2.7", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
argos-common = { workspace = true }
argos-evidence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_health"]
