[project]
name = "argos-evidence"
version = "0.6.0-alpha"
description = "ARGOS evidence service (ARG-061…070)"
requires-python = ">=3.12"
dependencies = [
    "argos-common",
    "argos-connector-sdk",
    "boto3>=1.43",
    "cryptography>=43",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "rfc3161-client>=1.0.9,<2",
]

[tool.uv.sources]
argos-common = { workspace = true }
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_evidence"]
