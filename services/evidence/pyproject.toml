[project]
name = "argos-evidence"
version = "0.11.0-alpha"
description = "ARGOS evidence service (ARG-061…070)"
requires-python = ">=3.12"
dependencies = [
    "argos-common",
    "argos-events",
    "argos-connector-sdk",
    "argos-ontology",
    "boto3>=1.43",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "reportlab>=5,<6",
    "rfc8785>=0.1.4,<0.2",
    "temporalio>=1.8",
    "uvicorn[standard]>=0.32",
    "rfc3161-client>=1.0.9,<2",
]

[tool.uv.sources]
argos-common = { workspace = true }
argos-events = { workspace = true }
argos-connector-sdk = { workspace = true }
argos-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_evidence"]
