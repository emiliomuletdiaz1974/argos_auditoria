[project]
name = "argos-evidence"
version = "0.2.0-alpha"
description = "ARGOS evidence service (ARG-061…070)"
requires-python = ">=3.12"
dependencies = [
    "argos-common",
    "boto3>=1.43",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_evidence"]
