[project]
name = "argos-support"
version = "0.1.0-alpha"
description = "Diagnostic package the operator reviews before it leaves, encrypted to support (ARG-088)"
requires-python = ">=3.12"
dependencies = ["argos-common", "argos-connector-sdk", "psycopg[binary]>=3.2", "pyrage>=1.2", "pyyaml>=6.0"]

[project.scripts]
argos-support = "argos_support.cli:main"

[tool.uv.sources]
argos-common = { workspace = true }
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_support"]
