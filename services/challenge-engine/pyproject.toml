[project]
name = "argos-challenge-engine"
version = "0.1.0-alpha"
description = "ARGOS challenge and campaign engine (ARG-007, ARG-041…050)"
requires-python = ">=3.12"
dependencies = [
    "argos-common",
    "argos-events",
    "argos-ontology",
    "temporalio>=1.8",
    "argos-auth",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0",
]

[tool.uv.sources]
argos-common = { workspace = true }
argos-events = { workspace = true }
argos-auth = { workspace = true }
argos-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_challenges"]
