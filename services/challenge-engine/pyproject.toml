[project]
name = "argos-challenge-engine"
version = "0.1.0-alpha"
description = "ARGOS challenge and campaign engine (ARG-007, ARG-041…050)"
requires-python = ">=3.12"
dependencies = ["argos-common", "temporalio>=1.8"]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_challenges"]
