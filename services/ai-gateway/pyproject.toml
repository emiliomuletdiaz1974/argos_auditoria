[project]
name = "argos-ai-gateway"
version = "0.1.0-alpha"
description = "ARGOS local AI gateway (ARG-051…060)"
requires-python = ">=3.12"
dependencies = [
    "argos-common",
    "argos-connector-sdk",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
    "httpx>=0.27",
]

[tool.uv.sources]
argos-common = { workspace = true }
argos-connector-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_ai"]
