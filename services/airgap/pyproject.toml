[project]
name = "argos-airgap"
version = "0.1.0-alpha"
description = "The airlock of the isolated appliance: verified imports and a closed list of exports (ARG-090)"
requires-python = ">=3.12"
dependencies = ["argos-common", "argos-evidence", "argos-ontology", "argos-support", "argos-updater", "psycopg[binary]>=3.2"]

[tool.uv.sources]
argos-common = { workspace = true }
argos-evidence = { workspace = true }
argos-ontology = { workspace = true }
argos-support = { workspace = true }
argos-updater = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_airgap"]
