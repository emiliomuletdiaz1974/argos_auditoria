[project]
name = "argos-example"
version = "0.1.0-alpha"
description = "Phase 1 example service: startup, health and journal pattern"
requires-python = ">=3.12"
dependencies = ["argos-common", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
argos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_example"]
