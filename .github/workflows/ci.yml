name: ci

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository: artifacts travel with the runtime token, not with this one.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make lint typecheck
      - name: secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact
      - run: make test
      - run: make policy-test
      - run: make ontology-gates
      - run: make challenge-lint
      - run: make challenge-catalog
      - run: make api-contract
      - run: make docs-check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make console-install
      - run: make console-lint console-test console-types

  console-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make console-install
      # The browser is heavy: it is cached by the version of Playwright in the lock file.
      - id: playwright
        run: echo "version=$(node -p "require('./console/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: make console-e2e-setup
      - run: make console-e2e

  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make dev
      - run: make cover   # unit + integration, with coverage threshold
      - if: always()
        run: make dev-down

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # ARG-087 (F09-09): the grype database is downloaded once a day and kept between runs.
      - id: day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/grype
          key: grype-db-${{ steps.day.outputs.date }}
          restore-keys: grype-db-
      # SBOM (CycloneDX) of every image and of the console, grype over each, and the gate.
      - run: make sbom
        env:
          ARGOS_GRYPE_CACHE: /home/runner/.cache/grype
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: dist/sbom }

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: dist/sbom }
      - run: make manifest
      - uses: actions/upload-artifact@v4
        with: { name: release, path: dist/release-manifest.json }

  sign:
    # Reserved: needs the release Vault (argos-release key) reachable from a self-hosted runner.
    if: false
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: uv run python tools/release.py sign

  selfcheck:
    # ARG-100 · ARGOS verifies ARGOS. Enabled in Phase 10; until then the stage is only declared.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "reserved - self-* verification campaign (ARG-100)"
