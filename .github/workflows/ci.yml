name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The jobs that need the whole environment of `make dev` run only when asked for (DP-22).
  workflow_dispatch:

# No job writes to the repository: artifacts travel with the runtime token, not with this one.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make lint typecheck
      - name: secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact
      - run: make test
      - run: make policy-test
      - run: make ontology-gates
      - run: make challenge-lint
      - run: make challenge-catalog
      - run: make api-contract
      - run: make docs-check

  integration:
    needs: verify
    # It raises the 37 containers of `make dev`: on the developer's machine with `make check`, and
    # here only by hand (DP-22).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make dev
      - run: make cover   # unit + integration, with coverage threshold
      - if: always()
        run: make dev-down

  build:
    needs: verify
    # It raises the 37 containers of `make dev`: on the developer's machine with `make check`, and
    # here only by hand (DP-22).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # ARG-087 (F09-09): the grype database is downloaded once a day and kept between runs.
      - id: day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/grype
          key: grype-db-${{ steps.day.outputs.date }}
          restore-keys: grype-db-
      # SBOM (CycloneDX) of every image, grype over each, and the gate.
      - run: make sbom
        env:
          ARGOS_GRYPE_CACHE: /home/runner/.cache/grype
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: dist/sbom }

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: dist/sbom }
      - run: make manifest
      - uses: actions/upload-artifact@v4
        with: { name: release, path: dist/release-manifest.json }

  sign:
    # Reserved: needs the release Vault (argos-release key) reachable from a self-hosted runner.
    if: false
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: uv run python tools/release.py sign

  hardening-gate:
    # Reserved (F09-14, ARG-081): needs the appliance image built on its hardware (F09-90). The
    # scanner of the image writes cis-report.json and tools/cis_gate.py refuses it below 90 % of
    # CIS Level 1 Server or with a failure not documented in platform/image/hardening-exceptions.yaml.
    if: false
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python tools/cis_gate.py --report dist/cis-report.json

  selfcheck:
    # ARG-100 · ARGOS verifies ARGOS. The campaign needs the whole environment, so until there is a
    # runner with it the gate is local: `make selfcheck` before every release (DP-16, F10-01).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "reserved - run make selfcheck locally (ARG-100, DP-16)"
