name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make lint typecheck
      - name: secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact
      - run: make test
      - run: make policy-test
      - run: make ontology-gates
      - run: make challenge-lint
      - run: make challenge-catalog
      - run: make docs-check

  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: make dev
      - run: make cover   # unit + integration, with coverage threshold
      - if: always()
        run: make dev-down

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - name: sbom
        run: |
          mkdir -p dist/sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/dist/sbom:/out" \
            anchore/syft:v1.14.0 "argos-example:$(cat VERSION)" -o spdx-json=/out/argos-example.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: dist/sbom }

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: dist/sbom }
      - run: make manifest
      - uses: actions/upload-artifact@v4
        with: { name: release, path: dist/release-manifest.json }

  sign:
    # Reserved: needs the release Vault (argos-release key) reachable from a self-hosted runner.
    if: false
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: uv run python tools/release.py sign

  selfcheck:
    # ARG-100 · ARGOS verifies ARGOS. Enabled in Phase 10; until then the stage is only declared.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "reserved - self-* verification campaign (ARG-100)"
